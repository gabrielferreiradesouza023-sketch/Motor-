[project]
name = "arb-engine"
version = "0.1.0"
description = "Fundação local e segura do motor de arbitragem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "PyYAML>=6,<7",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<1",
    "playwright>=1.58,<2",
]

[project.scripts]
arb = "arb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "pre-commit>=4,<5",
    "detect-secrets>=1.5,<2",
    "hypothesis>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
